# netlify.toml — deployment settings for the Bangla Society site.
# Netlify reads this from the repo root on every deploy.

[build]
  # The site IS the repo root: no bundler, no framework.
  publish = "."
  # The one build step: rebuild content/events.json and content/photos.json from
  # the per-file entries the CMS writes. Uses only Node built-ins (no npm install).
  command = "node scripts/index-content.js"

[build.environment]
  NODE_VERSION = "20"

# /admin (no slash) → /admin/ so it always opens the editor, never a stray file.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# ── Headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Content the CMS edits: always revalidate so a merged change shows on the next reload.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The editor: never cache, never index.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Uploaded photos and committee cards: cache for a day. (Decap keeps the
# original file name on upload, so re-uploading the same name is picked up
# within a day at most.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
